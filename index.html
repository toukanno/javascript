<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronoLab - React Clock Suite</title>
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(20, 31, 52, 0.75);
      --text: #eaf2ff;
      --muted: #98a7c0;
      --accent: #67b4ff;
      --danger: #ff7c99;
      --ok: #70f3b5;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #13213c, #070b14 45%, #04070e 80%);
      min-height: 100vh;
    }
    #root { padding: 24px; }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .card {
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .title { font-size: 1rem; margin: 0 0 12px; color: #b2d2ff; }
    .time {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: .06em;
      margin: 4px 0;
    }
    .date { color: var(--muted); font-size: .95rem; }
    .analog {
      width: 210px; height: 210px; border-radius: 50%;
      margin: 14px auto;
      border: 1px solid var(--border);
      position: relative;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.09), rgba(0,0,0,.15));
    }
    .tick {
      position: absolute; left: 50%; top: 50%; width: 2px; height: 98px;
      transform-origin: center top;
    }
    .tick::after {
      content: ""; display: block; width: 2px; height: 10px; margin: 0 auto;
      background: rgba(255,255,255,.45);
      border-radius: 99px;
    }
    .tick.main::after { height: 14px; background: #d5e7ff; }
    .hand {
      position: absolute; left: 50%; top: 50%; transform-origin: center bottom;
      border-radius: 100px;
    }
    .h { width: 7px; height: 52px; background: #d5e8ff; margin-left: -3.5px; margin-top: -52px; }
    .m { width: 5px; height: 72px; background: var(--accent); margin-left: -2.5px; margin-top: -72px; }
    .s { width: 2px; height: 86px; background: var(--danger); margin-left: -1px; margin-top: -86px; }
    .center {
      position: absolute; left: 50%; top: 50%; width: 13px; height: 13px;
      transform: translate(-50%, -50%);
      border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,.15);
    }
    label, select, input, button { font: inherit; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select, input {
      background: #0f1a2b; color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px;
    }
    button {
      border: 1px solid var(--border);
      background: #12335b;
      color: #e8f4ff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.secondary { background: #1a2740; }
    button.danger { background: #5e1f36; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    ul { padding: 0; list-style: none; margin: 8px 0 0; }
    li {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px dashed var(--border);
      color: #d7e5ff;
      gap: 8px;
    }
    .muted { color: var(--muted); font-size: .88rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
